<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>تماس با ما | مدرن یدک</title>
</head>
<body>

    <div id="header-placeholder"></div>

    <section class="page-header">
        <div class="container">
            <h1>تماس با ما</h1>
            <p>هر سوالی داشتید، در خدمت شما هستیم</p>
        </div>
    </section>

    <section class="contact-section">
        <div class="container">
            <div class="contact-info">
                <div class="contact-card">
                    <h3>تلفن</h3>
                    <p>۰۲۱-۱۲۳۴۵۶۷۸</p>
                </div>
                <div class="contact-card">
                    <h3>ایمیل</h3>
                    <p>info@modernyadak.ir</p>
                </div>
                <div class="contact-card">
                    <h3>آدرس</h3>
                    <p>تهران، خیابان آزادی</p>
                </div>
            </div>

            <form class="contact-form">
                <input type="text" placeholder="نام شما">
                <input type="text" placeholder="شماره تماس">
                <textarea rows="5" placeholder="پیام شما"></textarea>
                <button type="button" class="btn-primary">ارسال پیام</button>
            </form>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container">
            <p>© ۱۴۰۴ مدرن یدک - تمام حقوق محفوظ است</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
