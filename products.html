<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>محصولات | مدرن یدک</title>
</head>
<body>

    <div id="header-placeholder"></div>

    <section class="page-header">
        <div class="container">
            <h1>محصولات</h1>
            <p>همه‌ی قطعات یدکی مدرن یدک، یکجا</p>
        </div>
    </section>

    <section class="products-page">
        <div class="container">
            <div class="product-grid">

                <div class="product-card">
                    <div class="product-img"><img src="images/oil-filter.jpg" alt="فیلتر روغن اصلی"></div>
                    <h3>فیلتر روغن اصلی</h3>
                    <p class="product-desc">سازگار با اکثر خودروهای پژو و سمند</p>
                    <div class="product-footer">
                        <span class="price">۱۸۵,۰۰۰ تومان</span>
                        <button class="btn-small" data-name="فیلتر روغن اصلی" data-price="185000">افزودن</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-img"><img src="images/LENT.JPG" alt="لنت ترمز جلو"></div>
                    <h3>لنت ترمز جلو</h3>
                    <p class="product-desc">مناسب پراید و تیبا، گارانتی ۶ ماهه</p>
                    <div class="product-footer">
                        <span class="price">۴۲۰,۰۰۰ تومان</span>
                        <button class="btn-small" data-name="لنت ترمز جلو" data-price="420000">افزودن</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-img"><img src="images/BATRI.JPG" alt="باتری ۶۰ آمپر"></div>
                    <h3>باتری ۶۰ آمپر</h3>
                    <p class="product-desc">برند معتبر، گارانتی ۱۸ ماهه</p>
                    <div class="product-footer">
                        <span class="price">۲,۱۵۰,۰۰۰ تومان</span>
                        <button class="btn-small" data-name="باتری ۶۰ آمپر" data-price="2150000">افزودن</button>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container">
            <p>© ۱۴۰۴ مدرن یدک - تمام حقوق محفوظ است</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
